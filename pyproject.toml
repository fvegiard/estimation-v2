[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estimation-v2"
version = "0.1.0"
description = "Export déterministe de relevés électriques, profils Granby et CHUM"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24.3,<2", "Pillow>=10,<13", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
estimation-v2 = "estimation_v2.cli:main"

[tool.setuptools.packages.find]
include = ["estimation_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
